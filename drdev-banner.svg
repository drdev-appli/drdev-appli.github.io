<svg viewBox="0 0 4096 2304" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="100%">
      <stop offset="0%" stop-color="#16161c"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    <radialGradient id="glowTR" cx="100%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#22c55e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBL" cx="0%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4c4ca"/>
    </linearGradient>

    <!-- Light ray gradient: fades in/out along the ray direction -->
    <linearGradient id="rayFade" x1="4500" y1="-100" x2="-400" y2="2400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="15%" stop-color="#4ade80" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#bbf7d0" stop-opacity="1"/>
      <stop offset="85%" stop-color="#4ade80" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>

    <filter id="rayBlurBig" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="120"/>
    </filter>
    <filter id="rayBlurMid" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="rayBlurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background layers -->
  <rect width="4096" height="2304" fill="url(#bgGrad)"/>
  <rect width="4096" height="2304" fill="url(#glowTR)"/>
  <rect width="4096" height="2304" fill="url(#glowBL)"/>

  <!-- Light ray crossing the image (top-right to bottom-left) -->
  <!-- Outer atmospheric halo -->
  <line x1="4500" y1="-100" x2="-400" y2="2400"
        stroke="url(#rayFade)" stroke-width="380"
        stroke-opacity="0.18" stroke-linecap="round"
        filter="url(#rayBlurBig)"/>
  <!-- Mid glow -->
  <line x1="4500" y1="-100" x2="-400" y2="2400"
        stroke="url(#rayFade)" stroke-width="110"
        stroke-opacity="0.45" stroke-linecap="round"
        filter="url(#rayBlurMid)"/>
  <!-- Bright core -->
  <line x1="4500" y1="-100" x2="-400" y2="2400"
        stroke="url(#rayFade)" stroke-width="6"
        stroke-linecap="round"
        filter="url(#rayBlurSoft)"/>

  <!-- LEFT: Wordmark + Slogan -->
  <text x="850" y="1100"
        font-family="Segoe UI, -apple-system, Inter, Arial, sans-serif"
        font-weight="800"
        font-size="280"
        fill="url(#textGlass)"
        letter-spacing="-10">DRDev<tspan fill="#22c55e">.</tspan>App</text>

  <text x="860" y="1280"
        font-family="Segoe UI, -apple-system, Inter, Arial, sans-serif"
        font-weight="400"
        font-size="76"
        fill="#9ca3af"
        letter-spacing="-1">Apps mobiles utiles, sans fioriture.</text>
</svg>
